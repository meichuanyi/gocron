name: Sync Upstream

on:
  schedule:
    # 每天 UTC 4:00（北京时间 12:00）自动同步一次
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Merge upstream/master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/gocronx-team/gocron.git

      - name: Fetch upstream
        run: git fetch upstream master

      # GITHUB_TOKEN 没有 workflows 权限，不能推送包含 .github/workflows 改动的提交；
      # 因此合并上游后，workflow 文件一律保留本仓库自己的版本，避免 push 被拒。
      - name: Merge upstream changes
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Check if there's anything new to merge
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git merge upstream/master --no-commit --no-edit || true
            # 丢弃上游对 workflow 文件的改动（GITHUB_TOKEN 推不了这类提交）
            git checkout HEAD -- .github/workflows/
            git commit --no-edit
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to origin
        if: steps.merge.outputs.changed == 'true'
        run: git push origin master

      # GITHUB_TOKEN pushes don't auto-trigger other workflows,
      # so explicitly trigger the Docker build if we synced new code.
      - name: Trigger Docker build
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker.yml --repo "${{ github.repository }}" --ref master
